// Top-level build file. Same Android Gradle Plugin as the device apps (8.13.2 on Gradle 8.13).
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
