apply plugin: 'com.android.application'

// Version major.minor.revision.build from version.properties; CI increments build on every merge into dev.
def ver = new Properties()
rootProject.file('version.properties').withInputStream { ver.load(it) }
def appVersionName = "${ver.major}.${ver.minor}.${ver.revision}.${ver.build}".toString()

android {
    namespace 'com.example.citest'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.citest'
        minSdk 29
        targetSdk 34
        // The build number never resets, so it alone keeps versionCode increasing (Android needs that for updates).
        versionCode Math.max(1, ver.build as int)
        versionName appVersionName
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // Aligns all Kotlin stdlib artifacts to one version: appcompat brings kotlin-stdlib 1.8.22, while a transitive
    // dependency still asks for kotlin-stdlib-jdk7/-jdk8 1.6.21, whose classes moved into kotlin-stdlib in 1.8.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.1'

    // Local (JVM) unit tests in src/test: ./gradlew testDebugUnitTest
    testImplementation 'junit:junit:4.13.2'
}
