apply plugin: 'com.android.application'

// Version X.Y.Z: from the release tag (the release workflow passes -PappVersionName=X.Y.Z), else 0.0.0.
def appVersionName = (project.findProperty('appVersionName') ?: '0.0.0').toString()
def (verMajor, verMinor, verPatch) = appVersionName.tokenize('.').collect { it as int }

android {
    namespace 'com.example.citest'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.citest'
        minSdk 29
        targetSdk 34
        versionCode Math.max(1, verMajor * 10000 + verMinor * 100 + verPatch)
        versionName appVersionName
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // Aligns all Kotlin stdlib artifacts to one version: appcompat brings kotlin-stdlib 1.8.22, while a transitive
    // dependency still asks for kotlin-stdlib-jdk7/-jdk8 1.6.21, whose classes moved into kotlin-stdlib in 1.8.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.1'
}
