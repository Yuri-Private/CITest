name: CI (dev)

# dev is the integration branch: pull requests are merged into dev, and main gets dev's commits for releases.
# Every push (merge) to dev that changes the app or the firmware:
#  1. increments the build number (b in x.y.z.b) and commits it back to dev:
#     - app changed: app build + 1, the new app version is written into the firmware (UI_VERSION_* in
#       version.h), so the firmware source changed too: firmware build + 1 as well;
#     - only firmware changed: firmware build + 1;
#  2. builds what changed, from that version commit.
# The version commit is pushed with the workflow's own token, which does not start another run.
on:
  push:
    branches: [dev]
    # Changes to the CI itself also run it: both are built, no build number changes.
    paths: ['android/**', 'firmware/**', 'ci/**', '.github/workflows/**']
  # Start by hand: Actions → CI (dev) → Run workflow. Builds both, no build number changes.
  workflow_dispatch:

# One run at a time, so two pushes never get the same build number.
concurrency:
  group: ci-dev
  cancel-in-progress: false

permissions:
  contents: write   # push the version commit

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      android: ${{ steps.changes.outputs.android }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev           # latest dev, including version commits of earlier runs
          fetch-depth: 0

      - name: What changed
        id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" != push ]; then
            files=""                                    # started by hand: nothing to bump
          elif [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # dev was just created (or force-pushed): compare with main, where it branched off
            files=$(git diff --name-only "$(git merge-base origin/main "$AFTER")" "$AFTER")
          else
            files=$(git diff --name-only "$BEFORE" "$AFTER")
          fi
          if grep -q '^android/' <<<"$files"; then
            parts="android firmware"; android=true      # app changed: its version goes into the firmware too
          elif grep -q '^firmware/' <<<"$files"; then
            parts="firmware"; android=false
          else
            parts=""; android=true                      # only CI changed, or started by hand: build both
          fi
          echo "parts=$parts" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "Changed: $parts"

      # Release notes sort commits by their type prefix (feat:, fix:, ...); warn about commits without one.
      - name: Check commit messages
        if: github.event_name == 'push'
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            python3 ci/release-notes.py --lint "$BEFORE..$AFTER"
          fi

      - name: Bump the build numbers
        id: bump
        run: bash ci/version.sh ${{ steps.changes.outputs.parts }} | tee -a "$GITHUB_OUTPUT"

      - name: Commit the versions
        id: commit
        shell: bash
        env:
          APP: ${{ steps.bump.outputs.app_version }}
          FW: ${{ steps.bump.outputs.fw_version }}
          PARTS: ${{ steps.changes.outputs.parts }}
        run: |
          if [ -n "$PARTS" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Version: app $APP, firmware $FW"
            git push origin HEAD:dev
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  firmware:
    needs: version
    uses: ./.github/workflows/firmware.yml
    with:
      ref: ${{ needs.version.outputs.sha }}

  android:
    needs: version
    if: needs.version.outputs.android == 'true'
    uses: ./.github/workflows/android.yml
    with:
      ref: ${{ needs.version.outputs.sha }}

  release-notes:
    needs: version
    uses: ./.github/workflows/release-notes.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
