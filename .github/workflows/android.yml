name: Android app

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      # AGP 8.13 needs JDK 17 or newer.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Installs the Android SDK command-line tools and accepts the SDK licenses on the runner;
      # Gradle then downloads the platform and build tools the project needs (compileSdk 36).
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug and release APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - uses: actions/upload-artifact@v5
        with:
          name: CITestApp-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/**/*.apk
