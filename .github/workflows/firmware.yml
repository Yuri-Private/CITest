name: Firmware (STM32)

on:
  push:
    branches: ['**']   # branches only: tags are built by release.yml
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  workflow_dispatch:
  # Called by release.yml with the version from the release tag.
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Arm GNU Toolchain 13.3, the GCC generation bundled with current STM32CubeIDE versions.
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.3.Rel1'

      - name: Configure
        # A relative toolchain path is looked up under the build directory, then under the source directory (firmware/).
        run: >
          cmake -S firmware -B build -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake -DCMAKE_BUILD_TYPE=Release
          -DFW_VERSION=${{ inputs.version || '0.0.0' }}

      - name: Build
        run: cmake --build build

      - uses: actions/upload-artifact@v5
        with:
          name: CITest_FW-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/CITest_FW.elf
            build/CITest_FW.bin
            build/CITest_FW.hex
            build/CITest_FW.map
