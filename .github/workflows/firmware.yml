name: Firmware (STM32)

on:
  # dev is built by ci.yml (with version bump) and tags by release.yml; this covers main and the other branches.
  push:
    branches-ignore: [dev]
    paths: ['firmware/**', 'ci/test-report.py', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/**', 'ci/test-report.py', '.github/workflows/firmware.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit to build (default: the commit that started the run)"
        type: string
        required: false
        default: ''
    outputs:
      fw_version:
        value: ${{ jobs.build.outputs.fw_version }}
      ui_version:
        value: ${{ jobs.build.outputs.ui_version }}

jobs:
  # Host unit tests (firmware/test): the hardware-free firmware modules, compiled with the runner's own GCC
  # and tested with Unity. Runs beside the build; a failed test fails the run (and a release).
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Build the tests
        run: |
          cmake -S firmware/test -B build-test
          cmake --build build-test

      - name: Unit tests
        id: tests
        run: ctest --test-dir build-test --output-on-failure --output-junit test-results.xml

      - name: Test results
        if: always() && steps.tests.outcome != 'skipped'
        run: python3 ci/test-report.py "Firmware unit tests" build-test/test-results.xml

  build:
    runs-on: ubuntu-24.04
    outputs:
      fw_version: ${{ steps.version.outputs.fw_version }}
      ui_version: ${{ steps.version.outputs.ui_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Version
        id: version
        run: bash ci/version.sh | tee -a "$GITHUB_OUTPUT"

      # Arm GNU Toolchain 13.3, the GCC generation bundled with current STM32CubeIDE versions.
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.3.Rel1'

      - name: Configure
        # A relative toolchain path is looked up under the build directory, then under the source directory (firmware/).
        run: cmake -S firmware -B build -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - uses: actions/upload-artifact@v5
        with:
          name: CITest_FW-${{ steps.version.outputs.fw_version }}
          if-no-files-found: error
          path: |
            build/CITest_FW.elf
            build/CITest_FW.bin
            build/CITest_FW.hex
            build/CITest_FW.map
