name: Release

# Push a tag v* on a commit of main to publish its app and firmware as a GitHub Release:
#   git tag -a v1.0 -m "CITest 1.0"
#   git push origin v1.0
# The files carry the versions from the source (android/version.properties, firmware/Core/Inc/version.h).
# The release fails if the firmware is not paired with this app version (UI_VERSION != app version).
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the release

jobs:
  firmware:
    uses: ./.github/workflows/firmware.yml

  android:
    uses: ./.github/workflows/android.yml

  publish:
    needs: [firmware, android]
    runs-on: ubuntu-24.04
    steps:
      - name: Check the app-firmware pairing
        env:
          APP: ${{ needs.android.outputs.app_version }}
          UI: ${{ needs.firmware.outputs.ui_version }}
        run: |
          if [ "$APP" != "$UI" ]; then
            echo "::error title=App and firmware not paired::The firmware expects app $UI, but the app is $APP"
            exit 1
          fi
          echo "Paired: app $APP, firmware expects $UI"

      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Package
        shell: bash
        env:
          APP: ${{ needs.android.outputs.app_version }}
          FW: ${{ needs.firmware.outputs.fw_version }}
        run: |
          mkdir dist
          # Firmware: CITest_FW.elf -> CITest_FW-x.y.z.b.elf (and .bin, .hex, .map)
          find artifacts -name 'CITest_FW.*' | while read -r f; do
            cp "$f" "dist/CITest_FW-$FW.${f##*.}"
          done
          # App: app-debug.apk -> CITestApp-x.y.z.b-debug.apk, app-release-unsigned.apk -> CITestApp-x.y.z.b-release-unsigned.apk
          find artifacts -name '*.apk' | while read -r f; do
            name=$(basename "$f" .apk)
            cp "$f" "dist/CITestApp-$APP-${name#app-}.apk"
          done
          {
            echo "Release:   $GITHUB_REF_NAME"
            echo "App:       $APP"
            echo "Firmware:  $FW (paired with app $APP)"
            echo "Commit:    $GITHUB_SHA"
            echo "Built:     $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Run:       $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > dist/build-info.txt
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ needs.android.outputs.app_version }}
          FW: ${{ needs.firmware.outputs.fw_version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "CITest $GITHUB_REF_NAME" \
            --notes "App $APP and firmware $FW, built from $GITHUB_SHA. Checksums in SHA256SUMS, build details in build-info.txt."
